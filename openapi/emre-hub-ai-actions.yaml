openapi: 3.1.0
info:
  title: Emre OS AI Actions
  version: 1.0.0
  description: |
    Safe, AI-ready HTTP API for Emre OS (personal life dashboard).

    Designed for a future Custom GPT Action, OpenAI Assistants tool, or
    internal agent. Routes are **non-destructive** (no DELETE). Writes are
    inserts or upserts only and are always audit-logged server-side.

    Authentication: `Authorization: Bearer <AI_API_KEY>` (server env).
    All data access is scoped to a single hub owner UUID on the server.
  contact:
    name: Emre OS
servers:
  - url: https://YOUR_DEPLOYMENT_HOST
    description: Production (replace with your deployed Next.js URL)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Summary
  - name: Habits
  - name: Tasks
  - name: Movies
  - name: Journal
  - name: Analytics
  - name: College Counseling
  - name: SAT Vocab

paths:
  /api/ai/summary/today:
    get:
      operationId: getTodaySummary
      tags: [Summary]
      summary: Today's compact snapshot
      description: |
        Read-only snapshot: habit completion for today, incomplete tasks due
        today or overdue, and today's journal entry (if any).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TodaySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/habits:
    get:
      operationId: listHabits
      tags: [Habits]
      summary: List active habits
      description: Active habits with `completed_today` flag.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Habit list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/HabitWithToday"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/habits/log:
    patch:
      operationId: upsertHabitLog
      tags: [Habits]
      summary: Mark habit complete / incomplete
      description: |
        Non-destructive upsert of a habit log for a date (defaults to today).
        Never deletes rows.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLogInput"
            example:
              habit_id: "00000000-0000-0000-0000-000000000010"
              completed: true
              note: "Done after dinner"
      responses:
        "200":
          description: Upserted habit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HabitLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      description: Creates a task. Destructive delete is not available to AI.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              title: "Review SAT math practice"
              priority: high
              status: todo
              due_date: "2026-07-20"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/movies:
    get:
      operationId: listMovies
      tags: [Movies]
      summary: List movies / anime
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createMovie
      tags: [Movies]
      summary: Add a movie / anime
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
            example:
              title: "Frieren"
              kind: anime
              status: watching
              rating: 9
      responses:
        "201":
          description: Created movie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/journal/recent:
    get:
      operationId: listRecentJournal
      tags: [Journal]
      summary: Recent journal entries
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of entries (1–30, default 7)
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/journal:
    post:
      operationId: upsertJournal
      tags: [Journal]
      summary: Create or update a journal entry
      description: |
        Upserts the entry for `entry_date` (defaults to today). Non-destructive.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalInput"
            example:
              mood: 4
              content: "Solid study day. Gym later."
      responses:
        "200":
          description: Updated existing entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JournalEntry"
        "201":
          description: Created new entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/analytics/last-30-days:
    get:
      operationId: getLast30DaysAnalytics
      tags: [Analytics]
      summary: Last 30 days aggregates
      description: |
        Read-only aggregates: habit completion %, study hours, journal count,
        average mood, movies watched, books read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Analytics30Days"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/sat-vocab/progress:
    get:
      operationId: getSatVocabProgress
      tags: [SAT Vocab]
      summary: SAT vocabulary progress + today's session
      description: |
        Read-only summary of the 10-week SAT vocab plan progress, today's
        scheduled session (if any), and completed calendar dates.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Progress payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SatVocabProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /api/ai/college-counseling/context-pack:
    get:
      operationId: getCollegeCounselingContextPack
      tags: [College Counseling]
      summary: Counselor context pack (Markdown)
      description: |
        Read-only Markdown pack generated from the persisted college counseling
        document (or seed defaults). Does **not** call any LLM. Intended for
        Custom GPT Actions / counselor assistants.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Markdown context pack
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CollegeContextPack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Shared secret from server env `AI_API_KEY`.
        Send as `Authorization: Bearer <AI_API_KEY>`.
        Fallback header also accepted by the server: `x-ai-api-key`.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body or query failed Zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data: {}

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        details: {}

    IsoDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-07-19"

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]

    TaskPriority:
      type: string
      enum: [low, medium, high]

    WatchStatus:
      type: string
      enum: [planned, watching, watched]

    MediaKind:
      type: string
      enum: [anime, movie, series]

    HabitWithToday:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        frequency: { type: string, enum: [daily, weekly] }
        target_per_day: { type: integer }
        status: { type: string, enum: [active, archived] }
        completed_today: { type: boolean }

    HabitLogInput:
      type: object
      required: [habit_id, completed]
      properties:
        habit_id: { type: string, minLength: 1 }
        log_date: { $ref: "#/components/schemas/IsoDate" }
        completed: { type: boolean }
        note: { type: string, maxLength: 500 }

    HabitLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        habit_id: { type: string, format: uuid }
        log_date: { $ref: "#/components/schemas/IsoDate" }
        completed: { type: boolean }
        count: { type: integer }
        note: { type: string, nullable: true }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { $ref: "#/components/schemas/IsoDate" }
        project: { type: string, maxLength: 100 }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { $ref: "#/components/schemas/IsoDate", nullable: true }
        project: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MovieInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/MediaKind" }
        status: { $ref: "#/components/schemas/WatchStatus" }
        rating: { type: number, minimum: 0, maximum: 10 }
        review: { type: string, maxLength: 2000 }
        watched_date: { $ref: "#/components/schemas/IsoDate" }

    Movie:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: "#/components/schemas/MediaKind" }
        status: { $ref: "#/components/schemas/WatchStatus" }
        rating: { type: number, nullable: true }
        review: { type: string, nullable: true }
        watched_date: { $ref: "#/components/schemas/IsoDate", nullable: true }

    JournalInput:
      type: object
      required: [mood, content]
      properties:
        entry_date: { $ref: "#/components/schemas/IsoDate" }
        mood: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, minLength: 1, maxLength: 5000 }

    JournalEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_date: { $ref: "#/components/schemas/IsoDate" }
        mood: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }

    TodaySummary:
      type: object
      properties:
        date: { $ref: "#/components/schemas/IsoDate" }
        habits:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            completion_pct: { type: integer }
            remaining:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
        tasks_due_or_overdue:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        journal_today:
          oneOf:
            - $ref: "#/components/schemas/JournalEntry"
            - type: "null"

    Analytics30Days:
      type: object
      properties:
        range:
          type: object
          properties:
            start: { $ref: "#/components/schemas/IsoDate" }
            end: { $ref: "#/components/schemas/IsoDate" }
        habit_completion_pct: { type: integer }
        study_hours: { type: number }
        journal_entries: { type: integer }
        avg_mood: { type: number, nullable: true }
        movies_watched: { type: integer }
        books_read: { type: integer }

    CollegeContextPack:
      type: object
      required: [format, generated_at, markdown]
      properties:
        format:
          type: string
          const: markdown
        generated_at:
          type: string
          format: date-time
        markdown:
          type: string
          description: Full counselor context pack in Markdown

    SatVocabProgress:
      type: object
      properties:
        plan_start: { type: string, format: date }
        word_count: { type: integer }
        summary:
          type: object
          properties:
            learn_total: { type: integer }
            learned: { type: integer }
            tested: { type: integer }
            completed_days: { type: integer }
            plan_total: { type: integer }
            words_touched: { type: integer }
            words_total: { type: integer }
        today:
          type: object
          properties:
            date: { type: string, format: date }
            plan_id: { type: string, nullable: true }
            session_label: { type: string }
            kind: { type: string, enum: [learn, review, rest] }
            theme_focus: { type: string }
            words:
              type: array
              items: { type: string }
        completed_dates:
          type: array
          items: { type: string, format: date }
