<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML kaydet</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f7fb;color:#172033}
  main{max-width:520px;margin:48px auto;padding:24px;background:#fff;border:1px solid #dfe3ec;border-radius:12px}
  h1{font-size:22px;margin:0 0 10px}
  p{line-height:1.45;font-size:14px}
  button{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>HTML dosyasını kaydet</h1>
  <p id="lead">Dosya hazırlanıyor…</p>
  <p class="name" id="name"></p>
  <button id="save" type="button" disabled>İndir</button>
  <p id="msg"></p>
</main>
<script src="export.js"></script>
</body>
</html>
