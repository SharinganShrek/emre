<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT R&W Module Builder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>SAT R&W Module Builder</h1>
    <p class="sub">27-question Module 1 + harder 27-question Module 2</p>

    <section class="statusbox">
      <span id="dot" class="dot"></span>
      <span id="status">Checking College Board session…</span>
    </section>

    <label class="row"><input id="excludeActive" type="checkbox" checked> Exclude active Bluebook practice-test items</label>
    <label class="row"><input id="avoidHistory" type="checkbox" checked> Avoid questions generated by this extension before</label>
    <label class="field">Random seed <input id="seed" type="text" placeholder="leave blank for random"></label>

    <button id="build" disabled>Build & Open Mock</button>
    <button id="reset" class="secondary">Reset question history</button>

    <div id="progress" class="progress" hidden>
      <div id="bar"></div>
    </div>
    <pre id="log"></pre>

    <p class="note">Open the College Board <b>Student Question Bank</b> results page first and wait for it to load. Then open this extension.</p>
  </main>
<script src="popup.js"></script>
</body>
</html>
