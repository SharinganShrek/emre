<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Module Builder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>SAT Module Builder</h1>
    <p class="sub">R&amp;W 27+27 or Math 22+22 · syncs to Emre OS</p>

    <section class="statusbox">
      <span id="dot" class="dot"></span>
      <span id="status">Checking College Board session…</span>
    </section>

    <fieldset class="seg">
      <legend>Section</legend>
      <label><input type="radio" name="section" value="rw" checked> Reading and Writing</label>
      <label><input type="radio" name="section" value="math"> Math</label>
    </fieldset>

    <label class="row"><input id="excludeActive" type="checkbox" checked> Exclude active Bluebook practice-test items</label>
    <label class="row"><input id="avoidHistory" type="checkbox" checked> Avoid previously used questions (saved in Emre OS)</label>
    <label class="field">Random seed <input id="seed" type="text" placeholder="leave blank for random"></label>

    <h2>Emre OS</h2>
    <label class="field">App URL <input id="appOrigin" type="url" placeholder="https://emre-xi.vercel.app"></label>
    <label class="field">Connect token <input id="appToken" type="password" placeholder="from SAT Practice page"></label>
    <button id="saveApp" class="secondary">Save connection</button>
    <p id="appStatus" class="note"></p>

    <button id="reconnect" class="secondary">Reconnect College Board</button>
    <button id="build" disabled>Build & Open Mock</button>
    <button id="buildDownload" disabled>Build & Download HTML</button>
    <button id="downloadCurrent" class="secondary" disabled>Download Current Mock HTML</button>
    <button id="reset" class="secondary">Reset local question history</button>

    <div id="progress" class="progress" hidden>
      <div id="bar"></div>
    </div>
    <pre id="log"></pre>

    <p class="note">Generate a connect token on Emre OS → SAT Practice. That token is only for this extension; Custom GPT still reads results from the app. Keep Student Question Bank signed in.</p>
  </main>
<script src="popup.js"></script>
</body>
</html>
